<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Used Businesses</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="shortcut icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-content">
            <div class="nav-brand">
                <div class="nav-icon">&#128188;</div>
                <span>Used Businesses</span>
            </div>
            <div class="nav-links">
                <a href="index.html" class="nav-link active">Listings</a>
                <a href="admin.html" class="nav-link">Admin Dashboard</a>
                <button class="btn btn-secondary btn-nav-refresh" onclick="refreshListings()" title="Refresh listings">&#8635; Refresh</button>
            </div>
        </div>
    </nav>

    <div class="main-container">
        <div class="hero">
            <div class="hero-icon">&#128188;</div>
            <h1>Used Businesses for Sale</h1>
            <p>Browse available businesses in the city</p>
        </div>

        <div class="filter-bar">
            <div id="website-filter-btns" class="filter-btns-container"></div>
            <div class="search-bar">
                <span class="search-icon">&#128269;</span>
                <input type="text" id="search-input" placeholder="Search businesses..." oninput="searchListings(this.value)">
            </div>
        </div>

        <div id="cards-grid" class="cards-grid">
            <div class="empty-state" id="empty-state">
                <div class="empty-icon">&#128203;</div>
                <h3>No listings yet</h3>
                <p>Check back later for available businesses.</p>
            </div>
        </div>
    </div>

    <div id="booking-modal" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h2>Book a Viewing</h2>
                <button class="btn btn-close" onclick="closeBookingModal()">&#10005;</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="booking-listing-id">
                <input type="hidden" id="booking-listing-title">
                <div class="booking-business-info">
                    <span class="booking-business-icon">&#128188;</span>
                    <span id="booking-business-name">-</span>
                </div>
                <div class="form-group">
                    <label>Your Name</label>
                    <input type="text" id="booking-username" placeholder="Enter your name...">
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="text" id="booking-phone" placeholder="Your phone number...">
                </div>
                <div class="form-group">
                    <label>Preferred Date</label>
                    <input type="date" id="booking-date">
                </div>
                <div class="form-group">
                    <label>Preferred Time</label>
                    <input type="time" id="booking-time">
                </div>
                <div class="form-group">
                    <label>Notes (optional)</label>
                    <textarea id="booking-notes" placeholder="Any additional info..."></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeBookingModal()">Cancel</button>
                <button class="btn btn-primary" onclick="submitBooking()">Send Booking Request</button>
            </div>
        </div>
    </div>

    <div id="notification" class="notification"></div>

    <footer class="footer">
        <p>Used Businesses &copy; 2026</p>
    </footer>

    <script src="js/app.js"></script>
    <script src="js/website.js"></script>
</body>
</html>
